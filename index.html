<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" sizes="any" href="/icons/v2/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/v2/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/v2/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/v2/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/v2/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/v2/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&display=swap" rel="stylesheet" />
    <title>Travio Ghana — Admin</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("travio-ghana-admin-theme");
          var dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
